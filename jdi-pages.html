<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JDI Pages</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #0b0c0f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      padding: 8px;
    }

    .section {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .item a {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 10px 14px;
      text-decoration: none;
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fafafa;
    }

    .item a:hover {
      background: #f4f4f5;
    }

    .icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #111827;
      color: #ffffff;
      font-size: 14px;
    }

    .directory {
      grid-column: 1 / -1;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .directory {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="section">

      <div class="grid">

        <div class="item">
          <a
            href="https://app.getguru.com/page/42d56300-50f3-419e-9339-7becad1eeae6"
            target="_blank"
            rel="noopener"
          >
            <span class="icon">🌐</span>
            <span>JDI Resource Center</span>
          </a>
        </div>

        <div class="item">
          <a
            href="https://app.getguru.com/page/0b596af9-945c-47a6-a2c6-1e2b3e25a43b"
            target="_blank"
            rel="noopener"
          >
            <span class="icon">📣</span>
            <span>Announcements and Updates</span>
          </a>
        </div>

        <div class="item">
          <a
            href="https://app.getguru.com/page/4d7c671e-a269-44ca-ac37-c4deb0cc78fa"
            target="_blank"
            rel="noopener"
          >
            <span class="icon">ℹ️</span>
            <span>About JDI</span>
          </a>
        </div>

        <div class="item">
          <a
            href="https://app.organimi.com/public/organizations/67913095420a7ccb0771d922/charts/68a8a936f16bdf390e1f4b50/chart/view?pId=ae13a2f08eff98324310f782ecf75918feb235d17fd3bdf0b5df261d89365233"
            target="_blank"
            rel="noopener"
          >
            <span class="icon">👥</span>
            <span>JDI Organizational Chart</span>
          </a>
        </div>

        <div class="item directory">
          <a
            href="https://jdi-integrations-company.monday.com/boards/7422548484"
            target="_blank"
            rel="noopener"
          >
            <span class="icon">📇</span>
            <span>JDI Directory</span>
          </a>
        </div>

      </div>

    </div>
  </div>

</body>
</html>

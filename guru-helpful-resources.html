<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guru Helpful Resources</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #0b0c0f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      padding: 10px;
    }

    .section {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 14px;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item a {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 12px 16px;
      text-decoration: none;
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fafafa;
      transition: 0.15s ease;
    }

    .item a:hover {
      background: #f4f4f5;
      transform: translateY(-1px);
    }

    .icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #111827;
      color: #ffffff;
      font-size: 14px;
    }

    .text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .resource-name {
      font-weight: 700;
      color: #111827;
    }

    .resource-description {
      font-size: 12px;
      font-weight: 400;
      color: #6b7280;
    }

    @media (max-width: 640px) {
      .item a {
        min-height: 54px;
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="section">

      <div class="title">💡 Guru Helpful Resources</div>

      <div class="grid">

        <!-- Get Help In Just 15 Mins -->
        <div class="item">
          <a
            href="https://ai.getguru.com/15mincustomer"
            target="_blank"
            rel="noopener"
          >
            <span class="icon">☎️</span>

            <span class="text">
              <span class="resource-name">
                Get Help In Just 15 Mins
              </span>
              <span class="resource-description">
                Schedule a 15-minute Guru support call
              </span>
            </span>
          </a>
        </div>

        <!-- Guru Help Center -->
        <div class="item">
          <a
            href="https://help.getguru.com/docs/home"
            target="_blank"
            rel="noopener"
          >
            <span class="icon">❓</span>

            <span class="text">
              <span class="resource-name">
                Guru Help Center
              </span>
              <span class="resource-description">
                Access Guru help articles and documentation
              </span>
            </span>
          </a>
        </div>

        <!-- Guru Developer Network -->
        <div class="item">
          <a
            href="https://developer.getguru.com/"
            target="_blank"
            rel="noopener"
          >
            <span class="icon">🛠️</span>

            <span class="text">
              <span class="resource-name">
                Guru Developer Network
              </span>
              <span class="resource-description">
                Access Guru developer tools and technical resources
              </span>
            </span>
          </a>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
